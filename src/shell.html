<title>Negareh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Marcellus&family=Vazirmatn:wght@400;600&display=swap">
<style>
/* Layout: the painted world fills the screen; gilded cartouches float over it (page name left, shards and gold centre, controls right); story cards sit in a double gold rule like a manuscript page. */
:root{
  --lapis-deep:#1a1f4a;
  --lapis:#2b3a86;
  --gold:#c9a24a;
  --gold-hi:#ecd391;
  --vermilion:#c2452b;
  --ivory:#f6eedb;
  --turq:#3fa49b;
  --f-display:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-persian:"Aref Ruqaa","Noto Naskh Arabic",serif;
  --f-body:"Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sky-top:#f0a52c;--sky-bot:#fbdb8e;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--lapis-deep);color:var(--ivory);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
#bgc,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud>*{pointer-events:auto}
.glass{background:color-mix(in srgb,var(--lapis-deep) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--gold);outline:1px solid color-mix(in srgb,var(--gold) 40%,transparent);outline-offset:3px;border-radius:2px}
.page{justify-self:start;display:flex;align-items:baseline;gap:10px;padding:7px 14px 8px;min-width:0}
.page .num{font-family:var(--f-display);color:var(--gold-hi);font-size:13px;letter-spacing:.16em}
.page .name{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally{display:flex;align-items:center;gap:14px;padding:6px 14px}
.shards{display:flex;gap:6px}
.shard{width:16px;height:22px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:color-mix(in srgb,var(--ivory) 22%,transparent);transition:background .3s,transform .3s}
.shard.got{background:linear-gradient(160deg,#8fe0d4,var(--turq) 55%,#1d6e66);transform:scale(1.12)}
.gold{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--gold-hi);font-size:15px}
.ring{--p:0%;width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--gold) 0 var(--p),rgba(255,255,255,.18) var(--p) 100%);display:grid;place-items:center}
.ring i{width:9px;height:9px;background:linear-gradient(135deg,#fff1b8,var(--gold));transform:rotate(45deg);display:block}
.lamps{display:flex;gap:3px}.lamp{width:22px;height:16px;color:rgba(255,255,255,.22);display:block}.lamp svg{width:22px;height:16px;display:block}.lamp .fl{fill:transparent}
.lamp.on{color:var(--gold)}.lamp.on .fl{fill:#ffb347}
.btns{justify-self:end;display:flex;gap:6px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--gold-hi);
  background:color-mix(in srgb,var(--lapis-deep) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--gold)}
.icon:hover{background:var(--lapis)}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
#toast{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(8px);
  max-width:min(460px,calc(100vw - 32px));text-align:center;font-size:14px;line-height:1.45;padding:10px 18px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-wrap:balance;
  background:color-mix(in srgb,var(--lapis-deep) 88%,transparent);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#ink{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(20,14,40,.0) 0%,rgba(20,14,40,.85) 70%);transition:opacity .35s}
#ink.on{opacity:1}
.veil{position:fixed;inset:0;z-index:8;display:grid;place-items:center;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(120,64,8,.28)}
.card{width:min(420px,calc(100% - 24px));text-align:center;display:grid;gap:14px;padding:28px 24px 24px;background:var(--lapis-deep);
  border:1px solid var(--gold);outline:6px double color-mix(in srgb,var(--gold) 55%,transparent);outline-offset:4px;
  background-image:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--lapis) 70%,transparent),transparent 70%)}
.card h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.2em;margin:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.05em;margin:0;color:var(--gold-hi);text-wrap:balance}
.card .fa{font-family:var(--f-persian);color:color-mix(in srgb,var(--gold) 75%,transparent);font-size:15px;margin-top:-8px}
.card p{margin:0;font-size:14.5px;line-height:1.6;color:color-mix(in srgb,var(--ivory) 88%,var(--lapis));text-wrap:pretty}
.card .eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.rule{height:10px;background:radial-gradient(circle,var(--gold) 1.6px,transparent 2px) 0 50%/14px 10px repeat-x;opacity:.8}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:13.5px;line-height:1.45;color:color-mix(in srgb,var(--ivory) 85%,var(--lapis))}
.how b{color:var(--gold-hi);font-weight:600;font-family:var(--f-display);letter-spacing:.04em}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{display:grid;justify-items:center;gap:2px;padding:8px 8px 12px;cursor:pointer;color:var(--ivory);background:color-mix(in srgb,var(--lapis) 55%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:2px}
.role[aria-pressed="true"]{border-color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--gold-hi);background:color-mix(in srgb,var(--lapis) 85%,transparent)}
.role canvas{width:92px;height:92px}
.role b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.06em;color:var(--gold-hi)}
.role small{font-size:12px;line-height:1.35;color:color-mix(in srgb,var(--ivory) 80%,var(--lapis));text-wrap:balance}
.eyebrow .sub{letter-spacing:.06em;text-transform:none;color:color-mix(in srgb,var(--ivory) 70%,var(--lapis))}
.go{font-family:var(--f-display);font-size:16px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;background:var(--gold);color:var(--lapis-deep);border:0;padding:12px 20px;border-radius:2px}
.go:hover{background:var(--gold-hi)}
.go.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--gold)}
.row2{display:grid;gap:10px}
.stat{font-family:var(--f-display);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.goldline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px}.goldline i{width:12px;height:12px;background:linear-gradient(135deg,#fff1b8,var(--gold));transform:rotate(45deg);display:block}
.card #cpText{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
@media (max-width:620px){.hud{grid-template-columns:1fr auto}.tally{grid-column:1/-1;grid-row:2;justify-self:center}.page .name{max-width:calc(100vw - 300px)}.icon{width:36px;height:36px}}
#coachRing{position:fixed;left:0;top:0;z-index:4;pointer-events:none;width:0;height:0}
#coachRing i{position:absolute;left:-28px;top:-14px;width:56px;height:28px;border:3px solid #fff1b8;border-radius:50%;background:radial-gradient(rgba(255,226,140,.45),transparent 70%);box-shadow:0 0 16px rgba(255,214,120,.95);animation:cring 1.6s ease-out infinite}
#coachRing i+i{animation-delay:.8s}
#coachRing b{position:absolute;left:-10px;top:-74px;width:20px;height:24px;background:linear-gradient(#fff1b8,var(--gold));clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 2px rgba(60,30,0,.4));animation:cbob .9s ease-in-out infinite alternate}
@keyframes cring{from{transform:scale(.35);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes cbob{from{transform:translateY(0)}to{transform:translateY(10px)}}
#coach{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:14px;
  padding:10px 10px 10px 18px;width:max-content;max-width:min(480px,calc(100vw - 32px));box-sizing:border-box;font-family:var(--f-display);font-size:16px;line-height:1.35;text-wrap:balance}
#coachSkip{flex:none;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-hi);background:transparent;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);padding:7px 10px;border-radius:2px;cursor:pointer}
body.tut #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.icon.pulse{animation:cpulse 1.1s ease-in-out infinite}
@keyframes cpulse{50%{box-shadow:0 0 0 7px rgba(236,211,145,.4)}}
@media (prefers-reduced-motion:reduce){#toast,#ink,.shard{transition:none}#coachRing i,#coachRing b,.icon.pulse{animation:none}#coachRing i+i{display:none}}
</style>

<div id="stage"><canvas id="bgc" aria-hidden="true"></canvas><canvas id="gl" aria-label="Game: a painted palace you walk through by tapping"></canvas></div>
<div id="ink"></div>

<div class="hud">
  <div class="page glass"><span class="num" id="pnum">I</span><span class="name" id="pname">The Courtyard</span></div>
  <div class="tally glass" aria-live="polite"><div class="lamps" id="lamps" title="Lamps (lives)"><span class="lamp"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M2 9h14c0 3-3 5-7 5S2 12 2 9zM16 9l4-3" fill="currentColor" stroke="currentColor"/><path class="fl" d="M8 8c0-3 2-4 1-7 3 2 3 5 1 7z"/></svg></span><span class="lamp"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M2 9h14c0 3-3 5-7 5S2 12 2 9zM16 9l4-3" fill="currentColor" stroke="currentColor"/><path class="fl" d="M8 8c0-3 2-4 1-7 3 2 3 5 1 7z"/></svg></span><span class="lamp"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M2 9h14c0 3-3 5-7 5S2 12 2 9zM16 9l4-3" fill="currentColor" stroke="currentColor"/><path class="fl" d="M8 8c0-3 2-4 1-7 3 2 3 5 1 7z"/></svg></span><span class="lamp"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M2 9h14c0 3-3 5-7 5S2 12 2 9zM16 9l4-3" fill="currentColor" stroke="currentColor"/><path class="fl" d="M8 8c0-3 2-4 1-7 3 2 3 5 1 7z"/></svg></span><span class="lamp"><svg viewBox="0 0 22 16" aria-hidden="true"><path d="M2 9h14c0 3-3 5-7 5S2 12 2 9zM16 9l4-3" fill="currentColor" stroke="currentColor"/><path class="fl" d="M8 8c0-3 2-4 1-7 3 2 3 5 1 7z"/></svg></span></div><div class="shards" id="shards" aria-label="Cup shards found"><span class="shard"></span><span class="shard"></span><span class="shard"></span></div><div class="gold" title="Gold leaf: 25 lights a new lamp"><span class="ring" id="ring"><i></i></span><span id="goldN">0 / 25</span></div></div>
  <div class="btns">
    <button class="icon" id="bHint" aria-label="Ask the cat"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    <button class="icon" id="bTurnL" aria-label="Turn the view left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg></button>
    <button class="icon" id="bTurnR" aria-label="Turn the view right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icon" id="bSound" aria-label="Mute sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="icon" id="bRestart" aria-label="Restart this page"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="coachRing" hidden aria-hidden="true"><i></i><i></i><b></b></div>
<div id="coach" class="glass" hidden role="status" aria-live="polite"><span id="coachText"></span><button id="coachSkip">Skip</button></div>

<div class="veil" id="cardIntro">
  <div class="card">
    <h1>NEGAREH</h1>
    <div class="fa">نگاره</div>
    <div class="rule"></div>
    <div class="eyebrow">Choose Naghsh <span class="sub">(Role)</span></div>
    <div class="roles" role="group" aria-label="Choose Naghsh (Role)">
      <button class="role" id="rGirl" aria-pressed="true"><canvas width="160" height="160" id="cvGirl"></canvas><b>Mahtab</b></button>
      <button class="role" id="rCat" aria-pressed="false"><canvas width="160" height="160" id="cvCat"></canvas><b>Pashmak</b></button>
    </div>
    <div class="row2">
      <button class="go" id="bStart">Play Negareh</button>
      <button class="go ghost" id="bContinue" hidden>Continue</button>
      <button class="go ghost" id="bLearn">Tutorial</button>
    </div>
  </div>
</div>

<div class="veil" id="cardPage" hidden>
  <div class="card">
    <div class="eyebrow" id="cpEyebrow">Chapter I</div>
    <h2 id="cpTitle">The Courtyard</h2>
    <div class="rule"></div>
    <p id="cpText"></p>
    <button class="go" id="cpGo">Begin</button>
  </div>
</div>

<div class="veil" id="cardDone" hidden>
  <div class="card">
    <div class="eyebrow" id="cdEyebrow">Chapter I</div>
    <h2 id="cdTitle">The Courtyard</h2>
    <div class="rule"></div>
    <p class="goldline"><i></i><span class="stat" id="cdGold">0</span></p>
    <div class="row2"><button class="go" id="cdNext">Next chapter</button><button class="go ghost" id="cdReplay">Again</button></div>
  </div>
</div>
